<style>
/* Layout: harbour-postcard hero, vendors hung as gift tags on a grid, single-column detail pages. */
:root{
  --bg:#eef1f6;        /* winter frost */
  --surface:#ffffff;
  --ink:#132640;       /* midnight navy */
  --muted:#4c5a72;
  --line:#c8d0de;
  --spruce:#132640;
  --holly:#c4472f;
  --gilt:#ff8a75;
  --tag:#fbf7ec;
  --on-spruce:#f3efe2;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1524;--surface:#14213a;--ink:#e8edf5;--muted:#a3b0c4;--line:#2a3a56;
  --spruce:#132640;--holly:#ff8a75;--gilt:#ff9a85;--tag:#1a2a45;--on-spruce:#f3efe2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1524;--surface:#14213a;--ink:#e8edf5;--muted:#a3b0c4;--line:#2a3a56;
  --spruce:#132640;--holly:#ff8a75;--gilt:#ff9a85;--tag:#1a2a45;--on-spruce:#f3efe2;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:3px solid var(--gilt);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--spruce)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--spruce);color:var(--on-spruce)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.15rem;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{width:22px;height:auto;color:var(--on-spruce)}
.nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav a.link{text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:500;font-size:.95rem}
.nav a.link[aria-current="page"]{background:var(--on-spruce);color:var(--spruce)}
.nav a.link:hover{text-decoration:underline}

/* hero */
.hero{background:var(--spruce);color:var(--on-spruce);position:relative;overflow:hidden}
.hero .wrap{padding-block:40px 60px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:32px;align-items:center}
.hero .logo{width:150px;height:auto;color:#fff;display:block}
.logo-row{display:flex;align-items:center;gap:18px}
.mdates{display:none;font-family:var(--f-hand);font-size:1.7rem;line-height:1.05;color:var(--gilt)}
.mdates small{display:block;font-family:var(--f-body);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,4.6vw,3.2rem);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gilt)}
.hero p.lede{max-width:46ch;font-size:1.1rem;margin:18px 0 0;opacity:.92}
.stamp{width:150px;aspect-ratio:1;max-width:100%;border:2px dashed var(--gilt);border-radius:50%;display:grid;place-items:center;text-align:center;transform:rotate(-8deg);padding:14px;font-family:var(--f-hand);font-size:1.35rem;line-height:1.1;color:var(--gilt)}
.stamp small{display:block;font-family:var(--f-body);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.waves{position:absolute;left:0;right:0;bottom:-1px;height:22px;background:
  radial-gradient(circle at 12px -6px,transparent 16px,var(--bg) 17px) 0 0/24px 22px repeat-x}

/* sections */
section.block{padding-block:40px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--holly);font-weight:700;margin:0 0 6px}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 20px;text-wrap:balance}

/* filter chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .9rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* gift tags */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px;list-style:none;margin:0;padding:0}
.tag{position:relative;display:flex;flex-direction:column;background:var(--tag);border:1px solid var(--line);
  border-radius:10px;padding:14px 14px 18px;text-decoration:none;color:var(--ink);
  transition:transform .2s ease;height:100%}
.tag:hover{transform:translateY(-3px)}
.tag .ph{aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;margin-bottom:14px}
.tag h3{font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:0 0 4px;line-height:1.2}
.tag .cat{font-family:var(--f-hand);font-size:1.25rem;color:var(--holly);line-height:1}
.tag p{margin:8px 0 0;color:var(--muted);font-size:.95rem}

/* photo / placeholder */
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .fallback{width:100%;height:100%;display:grid;place-items:center;font-family:var(--f-display);font-size:2.4rem;color:var(--on-spruce);
  background:repeating-linear-gradient(45deg,var(--spruce) 0 14px,color-mix(in srgb,var(--spruce) 85%,var(--gilt)) 14px 28px)}

/* vendor page */
.back{display:inline-block;margin:24px 0 8px;font-weight:500}
.vendor{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;padding-block:8px 48px;align-items:start}
.gallery{display:grid;gap:10px}
.gallery .ph{aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:none}
.thumbs button[aria-current="true"]{border-color:var(--gilt)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.vendor h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5vw,3rem);margin:0;line-height:1.05;text-wrap:balance}
.vendor .cat{font-family:var(--f-hand);font-size:1.5rem;color:var(--holly)}
.about{white-space:pre-line;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
dl.contact{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0}
dl.contact dt{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dl.contact dd{margin:0;overflow-wrap:anywhere}
.copy{margin-left:8px;font:500 .8rem var(--f-body);border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.socials a{text-decoration:none;border:1px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:500;font-size:.9rem}
.socials a:hover{background:var(--ink);color:var(--bg)}
.stack{display:grid;gap:20px}

/* visit */
.visit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;padding-block:8px 48px}
table.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.hours th,table.hours td{text-align:left;padding:10px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
table.hours th{font-weight:500}
table.hours td.note{color:var(--muted);font-size:.9rem}
table.hours tr.today{background:color-mix(in srgb,var(--gilt) 14%,transparent)}
.btn{display:inline-block;background:var(--holly);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:999px}
.prose p{margin:0 0 12px;max-width:62ch;white-space:pre-line}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => "v-" + String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const yes = v => !/^(no|n|false|hide|hidden|0)$/i.test(String(v ?? "").trim());

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=='\r') f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function toObjects(rows){
  if(!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""));
  return rows.slice(1).filter(r => r.some(c => c.trim())).map(r => Object.fromEntries(head.map((h,i)=>[h,(r[i]??"").trim()])));
}

/* Google Drive share links -> embeddable image; any other URL passes through */
function img(url){
  url = String(url||"").trim(); if(!url) return "";
  const m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w1400` : url;
}
function photos(v){ return [v.photo_1,v.photo_2,v.photo_3,v.photo_4,v.photo_5].map(img).filter(Boolean); }
function initials(n){ return String(n).split(/\s+/).filter(w=>/[a-z0-9]/i.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join(""); }
function photoBox(src, name, eager){
  const fb = `<div class="fallback" aria-hidden="true">${esc(initials(name))}</div>`;
  if(!src) return fb;
  return `<img src="${esc(src)}" alt="${esc(name)}" ${eager?"":'loading="lazy"'} onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'${esc(initials(name))}'}))">`;
}
function socialURL(kind, v){
  v = String(v||"").trim(); if(!v) return "";
  if(/^https?:\/\//i.test(v)) return v;
  const h = v.replace(/^@/,"");
  return {instagram:`https://www.instagram.com/${h}/`, facebook:`https://www.facebook.com/${h}`, tiktok:`https://www.tiktok.com/@${h}`, etsy:`https://www.etsy.com/shop/${h}`, website:`https://${h}`}[kind] || v;
}
function socials(v){
  const kinds=[["website","Website"],["instagram","Instagram"],["facebook","Facebook"],["tiktok","TikTok"],["etsy","Etsy"]];
  const out = kinds.map(([k,l]) => { const u=socialURL(k,v[k]); return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`:""; }).join("");
  return out ? `<div class="socials">${out}</div>` : "";
}
function copyBtn(text){ return `<button class="copy" type="button" data-copy="${esc(text)}">Copy</button>`; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if(!b) return;
  const t = b.dataset.copy;
  const done = () => { b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1500); };
  try{ navigator.clipboard.writeText(t).then(done, ()=>selectText(b)); }catch(_){ selectText(b); }
});
function selectText(b){ const n=b.previousElementSibling; if(!n) return; const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------- data ---------- */
let DATA = SAMPLE, usingSample = true;
async function loadSheet(){
  if(!SHEET_ID.trim()) return;
  const tab = name => fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID.trim()}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`)
    .then(r => { if(!r.ok) throw new Error(name); return r.text(); }).then(t => toObjects(parseCSV(t)));
  try{
    const [vendors, hours, infoRows] = await Promise.all([tab("Vendors"), tab("Hours"), tab("Info")]);
    const info = {};
    infoRows.forEach(r => { if(r.setting) info[r.setting.toLowerCase().replace(/[^a-z0-9]+/g,"_")] = r.value; });
    DATA = { info:{...SAMPLE.info, ...info}, hours, vendors: vendors.filter(v => v.name && yes(v.show)) };
    usingSample = false;
  }catch(err){ console.warn("Could not read the Google Sheet, showing example content.", err); }
}

    <section class="block" style="padding-bottom:0">
      <p class="eyebrow">Plan your visit</p>
      <h2>Opening hours, directions &amp; contact</h2>
    </section>
    <div class="visit">
      <div class="stack">
        <div class="card">
          <h3 style="font-family:var(--f-display);font-weight:400;margin:0 0 8px">Opening hours</h3>
          ${I.dates_short?`<p style="margin:0 0 6px">Open ${esc(I.dates_short)} ${esc(I.year||"")}</p>`:""}
          ${H.length?`<div style="overflow-x:auto"><table class="hours"><tbody>
            ${H.map(h=>`<tr class="${String(h.days).toLowerCase().includes(today)?"today":""}"><th scope="row">${esc(h.days)}</th><td>${time(h)}</td><td class="note">${esc(h.note)}</td></tr>`).join("")}
          </tbody></table></div>`:`<p class="empty">Hours coming soon.</p>`}
        </div>
        <div class="card">
          <h3 style="font-family:var(--f-display);font-weight:400;margin:0 0 8px">Get in touch</h3>
          <dl class="contact">
            ${I.contact_email?`<dt>Email</dt><dd><span>${esc(I.contact_email)}</span>${copyBtn(I.contact_email)}</dd>`:""}
            ${I.contact_phone?`<dt>Phone</dt><dd><span>${esc(I.contact_phone)}</span>${copyBtn(I.contact_phone)}</dd>`:""}
          </dl>
          ${socials({instagram:I.instagram, facebook:I.facebook})}
        </div>
      </div>
      <div class="stack prose">
        <div>
          <h3 style="font-family:var(--f-display);font-weight:400;margin:0 0 8px">Where to find us</h3>
          ${I.venue?`<p><strong>${esc(I.venue)}</strong></p>`:""}
          ${I.address?`<p>${esc(I.address)}</p>`:""}
          ${I.map_link?`<p><a class="btn" href="${esc(I.map_link)}" target="_blank" rel="noopener">Open in maps ↗</a></p>`:""}
        </div>
        ${I.directions?`<div><p class="eyebrow">Getting here</p><p>${esc(I.directions)}</p></div>`:""}
        ${I.parking?`<div><p class="eyebrow">Parking</p><p>${esc(I.parking)}</p></div>`:""}
        ${I.accessibility?`<div><p class="eyebrow">Accessibility</p><p>${esc(I.accessibility)}</p></div>`:""}
        ${I.payment?`<div><p class="eyebrow">Paying</p><p>${esc(I.payment)}</p></div>`:""}
      </div>
    </div>
  </div>`;
}

/* ---------- router ---------- */
function render(){
  const h = location.hash.replace(/^#/,"");
  const app = $("#app");
  let route = "home";
  if(h === "visit"){ app.innerHTML = visitPage(); route="visit"; document.title = "Visit · " + DATA.info.event_name; }
  else if(h.startsWith("v-")){
    const v = DATA.vendors.find(x => slug(x.name) === h);
    app.innerHTML = v ? vendorPage(v) : home();
    route = v ? "vendor" : "home";
    document.title = v ? `${v.name} · ${DATA.info.event_name}` : DATA.info.event_name;
  } else { app.innerHTML = home(); document.title = DATA.info.event_name; }
  document.querySelectorAll(".nav a.link").forEach(a => a.setAttribute("aria-current", a.dataset.route===route ? "page" : "false"));
  $("#brand").textContent = DATA.info.event_name.replace(/\s+Folkestone$/i,"");
  $("#foot-name").textContent = `${DATA.info.event_name}${DATA.info.year?" · "+DATA.info.year:""}${usingSample?" · showing example content":""}`;
  const ig = socialURL("instagram", DATA.info.instagram);
  $("#foot-links").innerHTML = ig ? `<a href="${esc(ig)}" target="_blank" rel="noopener">Instagram ↗</a>` : "";
  if(route!=="home") window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(chip){
    const c = chip.dataset.cat;
    document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b===chip));
    document.querySelectorAll(".tags li").forEach(li => li.hidden = !!c && li.dataset.cat !== c);
  }
  const t = e.target.closest(".thumbs button");
  if(t){
    const v = DATA.vendors.find(x => slug(x.name) === location.hash.slice(1));
    $("#main-ph").innerHTML = photoBox(t.dataset.src, v ? v.name : "", true);
    document.querySelectorAll(".thumbs button").forEach(b => b.setAttribute("aria-current", b===t));
  }
});
window.addEventListener("hashchange", render);
render();
loadSheet().then(render);
</script>

</body></html>
